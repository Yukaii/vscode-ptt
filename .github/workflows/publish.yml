name: Publish Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (package and verify without publishing to marketplaces)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and Tests
        run: |
          pnpm run lint
          pnpm run test

      - name: Package extension (.vsix)
        run: pnpm exec vsce package --no-dependencies --out vscode-ptt.vsix

      - name: Publish to Visual Studio Marketplace
        if: ${{ !inputs.dry_run }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Secret VSCE_PAT is not set. Skipping Visual Studio Marketplace publish."
            exit 1
          fi
          pnpm exec vsce publish --packagePath vscode-ptt.vsix -p "$VSCE_PAT"

      - name: Publish to Open VSX Registry
        if: ${{ !inputs.dry_run }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::Secret OVSX_PAT is not set. Skipping Open VSX publish."
            exit 1
          fi
          pnpm exec ovsx publish vscode-ptt.vsix -p "$OVSX_PAT"

      - name: Create or Update GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists. Uploading vscode-ptt.vsix asset..."
            gh release upload "$tag" vscode-ptt.vsix --clobber
          else
            echo "Creating release $tag..."
            gh release create "$tag" vscode-ptt.vsix --title "$tag" --generate-notes
          fi
